version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
    open-pull-requests-limit: 10
    groups:
      # One PR a month for everything routine. Majors stay ungrouped: they get
      # their own PR because they are the ones worth reading.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # The two runtime dependencies are bundled into the committed dist/.
      # Dependabot cannot rebuild it, so any PR that bumps them fails dist-check
      # by construction. Bump these by hand and commit the rebuilt bundle with
      # the version change.
      - dependency-name: '@actions/core'
      - dependency-name: 'google-sheet-cli'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '04:00'
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
